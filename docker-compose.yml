version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: washermann-api
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - washermann-net

  postgres:
    image: postgres:16-alpine
    container_name: washermann-postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-washermann}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - washermann-net

  redis:
    image: redis:7-alpine
    container_name: washermann-redis
    ports:
      - '6379:6379'
    # No password in local dev — production uses Upstash via REDIS_URL
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - washermann-net

volumes:
  postgres_data:
  redis_data:

networks:
  washermann-net:
    driver: bridge
